:root{--bg:#090b17;--panel:#14182b;--panel2:#1b2038;--text:#edf0ff;--muted:#9da7c5;--accent:#9b6cff;--cyan:#43d9ff;--line:#303653;--good:#4de5aa;--bad:#ff6b95}*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at 75% -10%,#302053 0,transparent 45%),var(--bg);color:var(--text);font:15px/1.5 system-ui,Segoe UI,sans-serif}button,input,select,textarea{font:inherit}button{cursor:pointer;border:0}button:disabled{opacity:.45;cursor:not-allowed}.app{display:grid;grid-template-columns:230px 1fr;min-height:100vh}.sidebar{padding:24px 15px;border-right:1px solid var(--line);background:#0d1020}.brand{font-size:23px;font-weight:900;letter-spacing:1px;margin:4px 10px 26px}.brand span{color:var(--accent)}.nav{display:block;width:100%;padding:12px 14px;text-align:left;background:transparent;color:var(--muted);border-radius:12px;margin:3px 0}.nav.active,.nav:hover{color:white;background:#30264b}.main{padding:30px;max-width:1500px;width:100%;margin:auto}.top{display:flex;justify-content:space-between;align-items:center;gap:15px;margin-bottom:22px;flex-wrap:wrap}h1{font-size:30px;margin:0}h2{font-size:20px;margin:0 0 14px}h3{margin:0 0 8px}.muted,small{color:var(--muted)}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:16px}.card{background:linear-gradient(150deg,var(--panel),#101425);border:1px solid var(--line);border-radius:18px;padding:20px;min-width:0}.hero{display:grid;grid-template-columns:auto 1fr;align-items:center;gap:22px}.avatar{width:94px;height:94px;border:3px solid var(--accent);border-radius:24px;display:grid;place-items:center;font-size:48px;background:#27203f}.big{font-size:32px;font-weight:850}.bar{height:11px;background:#2b2f49;border-radius:30px;overflow:hidden;margin:9px 0}.fill{height:100%;background:linear-gradient(90deg,var(--accent),var(--cyan));transition:width .55s}.button{padding:10px 15px;background:var(--accent);color:#fff;border-radius:10px;font-weight:700}.button.secondary{background:#2a3049}.button.danger{background:#6d2844}.button:focus-visible,.nav:focus-visible{outline:2px solid var(--cyan)}.actions{display:flex;flex-wrap:wrap;gap:8px}.section{display:none}.section.active{display:block}.row{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}.stack{display:grid;gap:14px}.pill{border-radius:20px;background:#292e48;padding:4px 10px;color:#dce1ff;font-size:12px}.field{display:grid;gap:5px}.field input,.field select,.field textarea,.filters input,.filters select{width:100%;background:#0d1223;border:1px solid #424867;color:var(--text);padding:10px;border-radius:9px}.field textarea{min-height:80px;resize:vertical}.formgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.full{grid-column:1/-1}.filters{display:flex;gap:10px;flex-wrap:wrap;margin:14px 0}.filters>*{flex:1;min-width:145px}.quest{border-left:3px solid var(--accent)}.quest p{white-space:pre-wrap;overflow-wrap:anywhere}.tag{color:var(--cyan);font-size:12px}.toastwrap{position:fixed;bottom:20px;right:20px;z-index:50;display:grid;gap:8px}.toast{background:#292044;border:1px solid var(--accent);padding:13px 18px;border-radius:12px;box-shadow:0 10px 40px #0008;animation:pop .3s}.modal{position:fixed;inset:0;background:#000b;display:none;align-items:center;justify-content:center;z-index:30;padding:18px}.modal.show{display:flex}.dialog{background:#161b31;border:1px solid var(--accent);border-radius:18px;padding:24px;width:min(550px,100%);max-height:90vh;overflow:auto}.tree{display:flex;gap:10px;flex-wrap:wrap;margin:15px 0}.node{padding:13px 10px;border:1px solid #414561;border-radius:13px;min-width:115px;text-align:center;background:#16182b;opacity:.42}.node.unlocked{opacity:1;border-color:var(--accent);box-shadow:0 0 15px #8659ff33}.achievement.locked{opacity:.55}.chartbar{height:20px;background:#292e47;border-radius:6px;overflow:hidden;margin:6px 0}.chartbar>div{height:100%;background:linear-gradient(90deg,var(--accent),var(--cyan))}.rank{font-weight:800;color:var(--accent)}.empty{color:var(--muted);padding:24px;text-align:center;border:1px dashed var(--line);border-radius:14px}.levelup{position:fixed;inset:0;z-index:45;pointer-events:none;display:grid;place-items:center;font-size:clamp(36px,8vw,92px);font-weight:1000;text-shadow:0 0 40px var(--accent);animation:level 1.8s forwards}.history{display:grid;gap:8px}.historyline{border-bottom:1px solid var(--line);padding:10px 0}.theme-cyan{--accent:#29c7ef;--cyan:#a285ff}.theme-rose{--accent:#ed6bc4;--cyan:#ffd36c}.theme-green{--accent:#36d8aa;--cyan:#8d8cff}.reduced *, .reduced *:before,.reduced *:after{animation:none!important;transition:none!important}@keyframes pop{from{transform:translateY(15px);opacity:0}to{transform:none;opacity:1}}@keyframes level{0%{opacity:0;transform:scale(.5)}25%,65%{opacity:1;transform:scale(1)}100%{opacity:0;transform:scale(1.3)}}@media(max-width:760px){.app{display:block}.sidebar{position:sticky;top:0;z-index:10;padding:10px;background:#0d1020}.brand{font-size:17px;margin:0 0 6px}.navwrap{display:flex;overflow:auto;gap:5px}.nav{white-space:nowrap;width:auto;margin:0;padding:8px}.main{padding:16px}.hero{grid-template-columns:1fr}.formgrid{grid-template-columns:1fr}}

const KEY='levelup-os-v1';const SKILLS=['Intelligence','Strength','Discipline','Creativity','Communication','Knowledge','Productivity','Finance'];const DIFF={Easy:10,Normal:25,Hard:50,Epic:100,Legendary:200};const RANKS=['Beginner','Explorer','Adventurer','Warrior','Elite','Master','Grandmaster','Legend','Mythic','Immortal'];const RANK_LEVELS=[1,5,10,20,35,50,75,100,150,200];const NODES=[['First Steps',2],['Consistency',5],['Dedicated',10],['Specialist',15],['Expert',25],['Mastery',40],['Legendary Skill',60]];const ICONS=['🧑‍🚀','🦊','🐉','⚔️','🦅','👾','🦁','🌌','🛡️','🔥','🐺','🦉'];const $=id=>document.getElementById(id);const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const uid=()=>crypto.randomUUID?crypto.randomUUID():Date.now().toString(36)+Math.random().toString(36).slice(2);const now=()=>new Date().toISOString();const date=s=>s?new Date(s).toLocaleString('ro-RO'):'—';const money=d=>Math.round(DIFF[d]/2);const xpToLevel=l=>Math.floor(100*Math.pow(l-1,1.45));function levelFromXP(x){let l=1;while(l<10000&&xpToLevel(l+1)<=x)l++;return l}function skillLevel(x){let l=1;while(l<1000&&50*l*(l+1)/2<=x)l++;return l}const skillFloor=l=>50*(l-1)*l/2;function rank(l){let i=0;for(let j=0;j<RANK_LEVELS.length;j++)if(l>=RANK_LEVELS[j])i=j;return RANKS[i]};function fresh(){return{version:1,profile:{name:'Player One',avatar:'🧑‍🚀',title:'Rookie',theme:'purple',background:'nebula',frame:'standard',badge:[],sound:false,reduced:false},quests:[],completions:[],rewards:[],purchases:[],achievements:{},created:now()}}let state;try{state=JSON.parse(localStorage.getItem(KEY))||fresh()}catch{state=fresh()}if(!valid(state))state=fresh();function valid(s){return s&&s.version===1&&s.profile&&typeof s.profile.name==='string'&&Array.isArray(s.quests)&&Array.isArray(s.completions)&&Array.isArray(s.rewards)&&Array.isArray(s.purchases)&&s.achievements&&typeof s.achievements==='object'}function save(){try{localStorage.setItem(KEY,JSON.stringify(state))}catch(e){toast('Salvarea a eșuat. Exportă datele!')}}function totalXP(){return state.completions.reduce((a,c)=>a+c.xp,0)}function earned(){return state.completions.reduce((a,c)=>a+c.coins,0)}function spent(){return state.purchases.reduce((a,p)=>a+p.price,0)}function balance(){return earned()-spent()}function skillXP(name){return state.completions.filter(c=>c.skill===name).reduce((a,c)=>a+c.xp,0)}function countDiff(d){return state.completions.filter(c=>c.difficulty===d).length}function categoryCounts(){let m={};state.completions.forEach(c=>m[c.category]=(m[c.category]||0)+1);return m}function questCount(id){return state.completions.filter(c=>c.questId===id).length}function stats(){return{xp:totalXP(),level:levelFromXP(totalXP()),count:state.completions.length,coins:balance(),earned:earned(),ach:Object.keys(state.achievements).length}}function progress(x,l,fn){let lo=fn(l),hi=fn(l+1);return Math.max(0,Math.min(100,(x-lo)/(hi-lo)*100))}function bar(p){return `<div class="bar"><div class="fill" style="width:${p.toFixed(2)}%"></div></div>`}function toast(msg){const e=document.createElement('div');e.className='toast';e.textContent=msg;$('toasts').append(e);setTimeout(()=>e.remove(),4500)}let audio;function sound(){if(!state.profile.sound)return;try{audio??=new (window.AudioContext||window.webkitAudioContext)();let o=audio.createOscillator(),g=audio.createGain();o.connect(g);g.connect(audio.destination);o.frequency.setValueAtTime(520,audio.currentTime);o.frequency.exponentialRampToValueAtTime(850,audio.currentTime+.15);g.gain.setValueAtTime(.06,audio.currentTime);g.gain.exponentialRampToValueAtTime(.001,audio.currentTime+.25);o.start();o.stop(audio.currentTime+.25)}catch{}}function levelFx(l){if(state.profile.reduced)return;let el=document.createElement('div');el.className='levelup';el.textContent='LEVEL UP · '+l;document.body.append(el);setTimeout(()=>el.remove(),1900)}
const ACH=[];function add(id,title,description,rarity,icon,test){ACH.push({id,title,description,rarity,icon,test})}for(const n of [1,5,10,25,50,100,200,500,1000])add('quests'+n,n===1?'First Quest Completed':`${n} Quests Completed`,`Complete ${n} quests`,n>=500?'Mythic':n>=100?'Legendary':n>=25?'Epic':n>=5?'Rare':'Common','⚔️',()=>stats().count>=n);for(const n of [2,5,10,15,20,25,35,50,75,100,150,200])add('level'+n,`Reach Level ${n}`,`Reach player level ${n}`,n>=100?'Mythic':n>=50?'Legendary':n>=20?'Epic':n>=10?'Rare':'Common','🌟',()=>stats().level>=n);for(const n of [2,5,10,15,25,40,60])add('skill'+n,`Skill Level ${n}`,`Reach level ${n} in any skill`,n>=40?'Mythic':n>=25?'Legendary':n>=10?'Epic':'Rare','💠',()=>SKILLS.some(s=>skillLevel(skillXP(s))>=n));for(const d of ['Easy','Normal','Hard','Epic','Legendary'])add('diff'+d,`First ${d} Quest`,`Complete a ${d} quest`,d==='Legendary'?'Legendary':d==='Epic'?'Epic':'Common','🏆',()=>countDiff(d)>=1);for(const n of [1,5,10,25,50])add('shop'+n,`${n} Rewards Claimed`,`Purchase ${n} rewards`,n>=50?'Mythic':n>=25?'Legendary':'Rare','🎁',()=>state.purchases.length>=n);for(const n of [1,3,5,8])add('skillsUsed'+n,`${n} Skills Trained`,`Earn XP in ${n} different skills`,n===8?'Legendary':'Rare','🧠',()=>SKILLS.filter(s=>skillXP(s)>0).length>=n);for(const n of [2,5,10,20])add('repeat'+n,`Repeat Master ${n}`,`Complete the same quest ${n} times`,n>=20?'Legendary':'Epic','🔁',()=>state.quests.some(q=>questCount(q.id)>=n)||Object.values(state.completions.reduce((m,c)=>(m[c.questId]=(m[c.questId]||0)+1,m),{})).some(v=>v>=n));for(const n of [5,10,20,30])add('ach'+n,`${n} Achievements`, `Unlock ${n} achievements`,n>=30?'Mythic':'Epic','✨',()=>Object.keys(state.achievements).length>=n);for(const n of [100,500,1000,5000,10000])add('xp'+n,`${n} Total XP`,`Earn ${n} total XP`,n>=10000?'Mythic':n>=5000?'Legendary':'Rare','⚡',()=>totalXP()>=n);
function checkAchievements(){let unlocked=[];for(let i=0;i<ACH.length+1;i++){let change=false;for(const a of ACH){if(!state.achievements[a.id]&&a.test()){state.achievements[a.id]=now();unlocked.push(a);change=true}}if(!change)break}return unlocked}function rewardUpdates(old,skill,oldSkill){let s=stats();toast(`Quest Complete! +${s.xp-old.xp} XP · +${s.earned-old.earned} coins`);sound();if(s.level>old.level){levelFx(s.level);toast(`LEVEL UP! ${old.level} → ${s.level}`)}if(rank(s.level)!==rank(old.level))toast(`NEW RANK: ${rank(s.level)}`);if(skillLevel(skillXP(skill))>oldSkill)toast(`${skill} skill level up!`);let a=checkAchievements();a.forEach(x=>toast(`🏆 Achievement: ${x.title}`));save();render()}
const pages=[['dashboard','◈ Dashboard'],['quests','⚔ Quests'],['skills','💠 Skills'],['tree','◇ Skill Tree'],['achievements','🏆 Achievements'],['shop','🛍 Rewards Shop'],['history','▤ History'],['statistics','▥ Statistics'],['character','◉ Character'],['settings','⚙ Settings']];let page='dashboard',filters={search:'',difficulty:'All',status:'All',sort:'newest',historyCategory:'All',achRarity:'All',achStatus:'All',treeSkill:'Intelligence'};function go(id){page=id;document.querySelectorAll('.section').forEach(x=>x.classList.toggle('active',x.id===id));document.querySelectorAll('.nav').forEach(x=>x.classList.toggle('active',x.dataset.page===id));$('pageTitle').textContent=pages.find(p=>p[0]===id)[1].replace(/^[^ ]+ /,'');render();window.scrollTo({top:0,behavior:'instant'})}function render(){document.body.className='theme-'+(state.profile.theme||'purple')+(state.profile.reduced?' reduced':'');let s=stats();$('topStats').textContent=`LV ${s.level} · 🪙 ${s.coins}`;({dashboard:renderDashboard,quests:renderQuests,skills:renderSkills,tree:renderTree,achievements:renderAchievements,shop:renderShop,history:renderHistory,statistics:renderStatistics,character:renderCharacter,settings:renderSettings})[page]()}function renderDashboard(){let s=stats(),p=state.profile,latest=[...state.completions].reverse().slice(0,5);$('dashboard').innerHTML=`<div class="card hero" style="background:${p.background==='grid'?'linear-gradient(135deg,#13233d,#15162c)':p.background==='void'?'#10101a':'linear-gradient(120deg,#31204e,#101a34)'}"><div class="avatar" style="border-radius:${p.frame==='circle'?'50%':p.frame==='sharp'?'4px':'24px'}">${esc(p.avatar)}</div><div><div class="row"><div><h2>${esc(p.name)} <span class="pill">${esc(p.title)}</span></h2><div class="rank">${rank(s.level)} · Level ${s.level}</div></div><button class="button secondary" data-action="go" data-id="character">Customize</button></div>${bar(progress(s.xp,s.level,xpToLevel))}<small>${s.xp-xpToLevel(s.level)} / ${xpToLevel(s.level+1)-xpToLevel(s.level)} XP to next level · ${s.xp} total XP</small><div>${(p.badge||[]).map(b=>`<span class="pill">${esc(b)}</span>`).join(' ')}</div></div></div><div class="grid" style="margin:16px 0">${[['⚡ Total XP',s.xp],['🪙 Coins',s.coins],['⚔ Quests completed',s.count],['🏆 Achievements',`${s.ach}/${ACH.length}`]].map(x=>`<div class="card"><div class="muted">${x[0]}</div><div class="big">${x[1]}</div></div>`).join('')}</div><div class="grid"><div class="card"><div class="row"><h2>Skill Power</h2><button class="button secondary" data-action="go" data-id="skills">All Skills</button></div>${SKILLS.map(n=>`<div class="row"><span>${n}</span><span>LV ${skillLevel(skillXP(n))}</span></div>${bar(progress(skillXP(n),skillLevel(skillXP(n)),skillFloor))}`).join('')}</div><div class="card"><div class="row"><h2>Recent Victories</h2><button class="button secondary" data-action="go" data-id="quests">My Quests</button></div>${latest.length?latest.map(c=>`<div class="historyline"><b>${esc(c.name)}</b><div class="muted">+${c.xp} XP · ${date(c.at)}</div></div>`).join(''):'<div class="empty">Create your first quest to begin.</div>'}</div></div>`}
function renderQuests(){let arr=[...state.quests].filter(q=>(q.name+' '+q.description+' '+q.category).toLowerCase().includes(filters.search.toLowerCase())&&(filters.difficulty==='All'||q.difficulty===filters.difficulty)&&(filters.status==='All'||(filters.status==='Completed'?questCount(q.id)>0:filters.status==='Available'?(q.type==='repeatable'||!questCount(q.id)):q.type==='repeatable')));arr.sort((a,b)=>filters.sort==='name'?a.name.localeCompare(b.name):filters.sort==='xp'?DIFF[b.difficulty]-DIFF[a.difficulty]:filters.sort==='most'?questCount(b.id)-questCount(a.id):b.created.localeCompare(a.created));$('quests').innerHTML=`<div class="row"><p class="muted">You create every quest. Nothing is assigned automatically.</p><button class="button" data-action="questForm">+ Create Quest</button></div><div class="filters"><input id="questSearch" placeholder="Search quests..." value="${esc(filters.search)}"><select id="questDiff">${['All',...Object.keys(DIFF)].map(d=>`<option ${filters.difficulty===d?'selected':''}>${d}</option>`).join('')}</select><select id="questStatus">${['All','Available','Completed','Repeatable'].map(d=>`<option ${filters.status===d?'selected':''}>${d}</option>`).join('')}</select><select id="questSort">${[['newest','Newest'],['name','Name'],['xp','Highest XP'],['most','Most completed']].map(([v,n])=>`<option value="${v}" ${filters.sort===v?'selected':''}>${n}</option>`).join('')}</select></div><div class="grid">${arr.map(q=>{let done=questCount(q.id),blocked=q.type==='one-time'&&done>0;return `<div class="card quest"><div class="row"><span class="pill">${esc(q.difficulty)} · ${DIFF[q.difficulty]} XP</span><span class="tag">${esc(q.skill)}</span></div><h2 style="margin-top:12px">${esc(q.name)}</h2><p class="muted">${esc(q.description)}</p><div class="muted">${esc(q.category)} · ${q.type==='repeatable'?'Repeatable':'One-Time'} · 🪙 ${money(q.difficulty)}</div><div class="muted">Completed: ${done}</div><div class="actions" style="margin-top:14px"><button class="button" data-action="complete" data-id="${q.id}" ${blocked?'disabled':''}>${blocked?'Completed ✓':'Complete Quest'}</button><button class="button secondary" data-action="questForm" data-id="${q.id}">Edit</button><button class="button danger" data-action="deleteQuest" data-id="${q.id}">Delete</button></div></div>`}).join('')||'<div class="empty">No quests match your filters.</div>'}</div>`;$('questSearch').addEventListener('input',e=>{filters.search=e.target.value;let pos=e.target.selectionStart;renderQuests();$('questSearch').focus();$('questSearch').setSelectionRange(pos,pos)});for(let [id,key] of [['questDiff','difficulty'],['questStatus','status'],['questSort','sort']])$(id).onchange=e=>{filters[key]=e.target.value;renderQuests()}}
function modal(html){$('dialog').innerHTML=html;$('modal').classList.add('show')}function closeModal(){$('modal').classList.remove('show');$('dialog').innerHTML=''}function questForm(id){let q=state.quests.find(x=>x.id===id)||{name:'',description:'',category:'Personal',difficulty:'Normal',skill:'Intelligence',type:'one-time'};modal(`<h2>${id?'Edit':'Create'} Quest</h2><form id="questForm" class="formgrid"><label class="field full">Quest name<input name="name" maxlength="100" required value="${esc(q.name)}"></label><label class="field full">Description<textarea name="description" maxlength="1500">${esc(q.description)}</textarea></label><label class="field">Category<input name="category" maxlength="50" required value="${esc(q.category)}"></label><label class="field">Difficulty<select name="difficulty">${Object.keys(DIFF).map(d=>`<option ${q.difficulty===d?'selected':''}>${d}</option>`).join('')}</select></label><label class="field">Skill<select name="skill">${SKILLS.map(d=>`<option ${q.skill===d?'selected':''}>${d}</option>`).join('')}</select></label><label class="field">Quest type<select name="type"><option value="one-time" ${q.type==='one-time'?'selected':''}>One-Time</option><option value="repeatable" ${q.type==='repeatable'?'selected':''}>Repeatable</option></select></label><div class="full muted" id="preview"></div><div class="actions full"><button class="button" type="submit">Save Quest</button><button class="button secondary" type="button" data-action="close">Cancel</button></div></form>`);let f=$('questForm'),upd=()=>{$('preview').textContent=`Reward: ${DIFF[f.elements.difficulty.value]} XP + ${money(f.elements.difficulty.value)} coins`};f.elements.difficulty.onchange=upd;upd();f.onsubmit=e=>{e.preventDefault();let v=Object.fromEntries(new FormData(f));v.name=v.name.trim();v.category=v.category.trim();if(!v.name||!v.category)return toast('Name and category are required');if(id){Object.assign(q,v)}else state.quests.push({...v,id:uid(),created:now()});save();closeModal();render();toast(id?'Quest updated':'Quest created')}}function complete(id){let q=state.quests.find(x=>x.id===id);if(!q)return;if(q.type==='one-time'&&questCount(id))return toast('This quest was already completed');modal(`<h2>Complete Quest?</h2><p>Confirm that you completed <b>${esc(q.name)}</b>.</p><p class="rank">+${DIFF[q.difficulty]} XP · +${money(q.difficulty)} coins · ${esc(q.skill)}</p><div class="actions"><button class="button" id="confirmComplete">Confirm Completion</button><button class="button secondary" data-action="close">Cancel</button></div>`);$('confirmComplete').onclick=()=>{if(q.type==='one-time'&&questCount(id)){closeModal();return}let old=stats(),oldSkill=skillLevel(skillXP(q.skill));state.completions.push({id:uid(),questId:q.id,name:q.name,category:q.category,difficulty:q.difficulty,skill:q.skill,xp:DIFF[q.difficulty],coins:money(q.difficulty),at:now()});closeModal();rewardUpdates(old,q.skill,oldSkill)}}function deleteQuest(id){let q=state.quests.find(x=>x.id===id);if(!q)return;modal(`<h2>Delete Quest?</h2><p>Delete <b>${esc(q.name)}</b>? Previous completion records and earned rewards remain in your history.</p><div class="actions"><button class="button danger" id="confirmDelete">Delete</button><button class="button secondary" data-action="close">Cancel</button></div>`);$('confirmDelete').onclick=()=>{state.quests=state.quests.filter(x=>x.id!==id);save();closeModal();render()}}
function renderSkills(){$('skills').innerHTML=`<p class="muted">These are virtual game statistics, not evaluations of your real abilities.</p><div class="grid">${SKILLS.map(n=>{let xp=skillXP(n),l=skillLevel(xp),entries=state.completions.filter(c=>c.skill===n);return `<div class="card"><div class="row"><h2>${n}</h2><span class="pill">Level ${l}</span></div><div class="big">${xp} XP</div>${bar(progress(xp,l,skillFloor))}<small>${xp-skillFloor(l)} / ${skillFloor(l+1)-skillFloor(l)} XP · ${entries.length} completions</small><details><summary>Skill history</summary>${entries.length?[...entries].reverse().map(c=>`<div class="historyline">${esc(c.name)} · +${c.xp} XP<br><small>${date(c.at)}</small></div>`).join(''):'<p class="muted">No history yet.</p>'}</details></div>`}).join('')}</div>`}function renderTree(){$('tree').innerHTML=`<div class="card"><h2>Interactive Skill Tree</h2><p class="muted">Nodes unlock automatically as your chosen skill levels up.</p><label class="field">Choose skill<select id="treeSelect">${SKILLS.map(n=>`<option ${filters.treeSkill===n?'selected':''}>${n}</option>`).join('')}</select></label><div id="treeNodes"></div></div>`;$('treeSelect').onchange=e=>{filters.treeSkill=e.target.value;renderTree()};let l=skillLevel(skillXP(filters.treeSkill));$('treeNodes').innerHTML=`<h3 style="margin-top:20px">${filters.treeSkill} · Level ${l}</h3><div class="tree">${NODES.map(([name,required],i)=>`<div class="node ${l>=required?'unlocked':''}" title="Requires skill level ${required}"><div style="font-size:25px">${l>=required?'✦':'🔒'}</div><b>${name}</b><div class="muted">Level ${required}</div><small>${l>=required?'Unlocked':'Locked'}</small></div>${i<NODES.length-1?'<span style="align-self:center;color:var(--accent)">⟶</span>':''}`).join('')}</div>`}
function renderAchievements(){let list=ACH.filter(a=>(filters.achRarity==='All'||a.rarity===filters.achRarity)&&(filters.achStatus==='All'||(filters.achStatus==='Unlocked')===!!state.achievements[a.id]));$('achievements').innerHTML=`<div class="row"><p>${Object.keys(state.achievements).length} / ${ACH.length} unlocked</p><div class="filters"><select id="rarityFilter">${['All','Common','Rare','Epic','Legendary','Mythic'].map(x=>`<option ${filters.achRarity===x?'selected':''}>${x}</option>`).join('')}</select><select id="achFilter">${['All','Unlocked','Locked'].map(x=>`<option ${filters.achStatus===x?'selected':''}>${x}</option>`).join('')}</select></div></div><div class="grid">${list.map(a=>`<div class="card achievement ${state.achievements[a.id]?'':'locked'}"><div class="row"><span style="font-size:30px">${a.icon}</span><span class="pill">${a.rarity}</span></div><h3>${a.title}</h3><p class="muted">${a.description}</p><small>${state.achievements[a.id]?'Unlocked '+date(state.achievements[a.id]):'🔒 Locked'}</small></div>`).join('')}</div>`;for(let [id,key] of [['rarityFilter','achRarity'],['achFilter','achStatus']])$(id).onchange=e=>{filters[key]=e.target.value;renderAchievements()}}
function rewardForm(id){let r=state.rewards.find(x=>x.id===id)||{name:'',description:'',price:50};modal(`<h2>${id?'Edit':'Create'} Reward</h2><form id="rewardForm" class="stack"><label class="field">Reward name<input name="name" maxlength="100" required value="${esc(r.name)}"></label><label class="field">Description<textarea name="description" maxlength="500">${esc(r.description)}</textarea></label><label class="field">Price (virtual coins)<input name="price" type="number" min="1" max="100000000" step="1" required value="${r.price}"></label><div class="actions"><button class="button">Save Reward</button><button class="button secondary" type="button" data-action="close">Cancel</button></div></form>`);$('rewardForm').onsubmit=e=>{e.preventDefault();let v=Object.fromEntries(new FormData(e.target));v.name=v.name.trim();v.price=Number(v.price);if(!v.name||!Number.isSafeInteger(v.price)||v.price<1||v.price>100000000)return toast('Enter a valid name and price');if(id)Object.assign(r,v);else state.rewards.push({...v,id:uid(),created:now()});save();closeModal();render();toast('Reward saved')}}function renderShop(){$('shop').innerHTML=`<div class="row"><div><h2>🪙 ${balance()} coins available</h2><p class="muted">Only you decide what rewards are worth.</p></div><button class="button" data-action="rewardForm">+ Create Reward</button></div><div class="grid">${state.rewards.map(r=>`<div class="card"><div class="row"><h2>${esc(r.name)}</h2><span class="pill">🪙 ${r.price}</span></div><p class="muted">${esc(r.description)}</p><div class="actions"><button class="button" data-action="buy" data-id="${r.id}" ${balance()<r.price?'disabled':''}>Claim Reward</button><button class="button secondary" data-action="rewardForm" data-id="${r.id}">Edit</button><button class="button danger" data-action="deleteReward" data-id="${r.id}">Delete</button></div></div>`).join('')||'<div class="empty">No rewards created yet.</div>'}</div><div class="card" style="margin-top:16px"><h2>Purchase History</h2>${[...state.purchases].reverse().map(p=>`<div class="historyline row"><span>${esc(p.name)} · ${date(p.at)}</span><b>−${p.price} coins</b></div>`).join('')||'<p class="muted">No purchases yet.</p>'}</div>`}function buy(id){let r=state.rewards.find(x=>x.id===id);if(!r||balance()<r.price)return toast('Not enough coins');modal(`<h2>Claim Reward?</h2><p>${esc(r.name)} costs <b>${r.price} coins</b>.</p><div class="actions"><button class="button" id="confirmBuy">Confirm Purchase</button><button class="button secondary" data-action="close">Cancel</button></div>`);$('confirmBuy').onclick=()=>{if(balance()<r.price)return;state.purchases.push({id:uid(),rewardId:id,name:r.name,price:r.price,at:now()});let a=checkAchievements();save();closeModal();render();sound();toast('Reward Purchased: '+r.name);a.forEach(x=>toast('Achievement: '+x.title))}}function deleteReward(id){let r=state.rewards.find(x=>x.id===id);if(!r)return;modal(`<h2>Delete Reward?</h2><p>Purchase history will remain.</p><div class="actions"><button class="button danger" id="confirmDeleteReward">Delete</button><button class="button secondary" data-action="close">Cancel</button></div>`);$('confirmDeleteReward').onclick=()=>{state.rewards=state.rewards.filter(x=>x.id!==id);save();closeModal();render()}}
function renderHistory(){let cats=['All',...new Set(state.completions.map(c=>c.category))],rows=[...state.completions].reverse().filter(c=>filters.historyCategory==='All'||c.category===filters.historyCategory);$('history').innerHTML=`<div class="grid" style="margin-bottom:16px"><div class="card">Total completions<div class="big">${state.completions.length}</div></div><div class="card">XP earned<div class="big">${totalXP()}</div></div><div class="card">Coins earned<div class="big">${earned()}</div></div></div><div class="card"><div class="row"><h2>Quest History</h2><select id="historyFilter" style="padding:8px;background:#171c32;color:white;border:1px solid #444">${cats.map(c=>`<option ${filters.historyCategory===c?'selected':''}>${esc(c)}</option>`).join('')}</select></div><div class="history">${rows.map(c=>`<div class="historyline row"><div><b>${esc(c.name)}</b><div class="muted">${date(c.at)} · ${esc(c.category)} · ${esc(c.difficulty)} · ${esc(c.skill)}</div></div><div>+${c.xp} XP · 🪙 +${c.coins}</div></div>`).join('')||'<div class="empty">No completed quests.</div>'}</div></div>`;$('historyFilter').onchange=e=>{filters.historyCategory=e.target.value;renderHistory()}}
function renderStatistics(){let s=stats(),cats=categoryCounts(),topCat=Object.entries(cats).sort((a,b)=>b[1]-a[1])[0],skills=SKILLS.map(n=>[n,skillXP(n)]),best=[...skills].sort((a,b)=>b[1]-a[1])[0],max=Math.max(1,...skills.map(x=>x[1]));let timeline=state.completions.reduce((a,c)=>{let last=a.length?a[a.length-1].xp:0;a.push({at:c.at,xp:last+c.xp});return a},[]);$('statistics').innerHTML=`<div class="grid">${[['Total XP',s.xp],['Quests completed',s.count],['Total coins earned',s.earned],['Current level',s.level],['Highest skill',best[1]?`${best[0]} (${best[1]} XP)`:'—'],['Top category',topCat?`${topCat[0]} (${topCat[1]})`:'—'],['Epic quests',countDiff('Epic')],['Legendary quests',countDiff('Legendary')],['Achievements unlocked',s.ach]].map(([k,v])=>`<div class="card"><div class="muted">${k}</div><div class="big" style="font-size:24px">${esc(v)}</div></div>`).join('')}</div><div class="grid" style="margin-top:16px"><div class="card"><h2>XP by Skill</h2>${skills.map(([n,v])=>`<div class="row"><span>${n}</span><b>${v}</b></div><div class="chartbar"><div style="width:${v/max*100}%"></div></div>`).join('')}</div><div class="card"><h2>Level Evolution</h2>${timeline.length?`<svg viewBox="0 0 600 240" width="100%" role="img" aria-label="Player level progression"><line x1="20" y1="220" x2="580" y2="220" stroke="#596079"/><polyline fill="none" stroke="var(--cyan)" stroke-width="4" points="${[{xp:0},...timeline].map((v,i,arr)=>`${20+i/(arr.length-1)*560},${220-(levelFromXP(v.xp)-1)/Math.max(1,s.level-1)*195}`).join(' ')}"/></svg><small>Level 1 → Level ${s.level} · ${timeline.length} completions</small>`:'<div class="empty">Complete quests to generate your progression chart.</div>'}<h3>Quest categories</h3>${Object.entries(cats).map(([n,v])=>`<div class="row"><span>${esc(n)}</span><b>${v}</b></div>`).join('')||'<p class="muted">No data yet.</p>'}</div></div>`}
function renderCharacter(){let p=state.profile,s=stats();let titles=['Rookie',...(s.level>=5?['Explorer']:[]),...(s.level>=10?['Adventurer']:[]),...(s.level>=25?['Champion']:[]),...(s.level>=50?['Master']:[]),...(s.level>=100?['Legend']:[])];let badges=ACH.filter(a=>state.achievements[a.id]).map(a=>a.title);$('character').innerHTML=`<div class="grid"><div class="card"><div class="avatar" style="margin-bottom:14px">${esc(p.avatar)}</div><h2>${esc(p.name)}</h2><p class="rank">${rank(s.level)} · ${esc(p.title)}</p><p class="muted">Cosmetics unlock through game progression.</p></div><div class="card"><h2>Customize Character</h2><form id="characterForm" class="stack"><label class="field">Username<input name="name" required maxlength="40" value="${esc(p.name)}"></label><label class="field">Avatar<select name="avatar">${ICONS.map((x,i)=>`<option value="${x}" ${p.avatar===x?'selected':''} ${i>=6&&s.level<10?'disabled':''}>${x} ${i>=6?'(Level 10)':''}</option>`).join('')}</select></label><label class="field">RPG title<select name="title">${titles.map(x=>`<option ${p.title===x?'selected':''}>${x}</option>`).join('')}</select></label><label class="field">Profile color<select name="theme">${[['purple','Neon Purple'],['cyan','Electric Blue'],['rose','Neon Rose'],['green','Emerald']].map(([v,n],i)=>`<option value="${v}" ${p.theme===v?'selected':''} ${i>=2&&s.level<15?'disabled':''}>${n}${i>=2?' (Level 15)':''}</option>`).join('')}</select></label><label class="field">Profile background<select name="background">${[['nebula','Nebula'],['grid','Cyber Grid'],['void','Dark Void']].map(([v,n],i)=>`<option value="${v}" ${p.background===v?'selected':''} ${i>0&&s.level<5?'disabled':''}>${n}${i>0?' (Level 5)':''}</option>`).join('')}</select></label><label class="field">Avatar frame<select name="frame">${[['standard','Standard'],['circle','Circle'],['sharp','Sharp']].map(([v,n],i)=>`<option value="${v}" ${p.frame===v?'selected':''} ${i>0&&s.level<10?'disabled':''}>${n}${i>0?' (Level 10)':''}</option>`).join('')}</select></label><label class="field">Profile badge (unlocked achievements)<select name="badge"><option value="">None</option>${badges.map(b=>`<option ${p.badge?.includes(b)?'selected':''}>${esc(b)}</option>`).join('')}</select></label><button class="button">Save Character</button></form></div></div>`;$('characterForm').onsubmit=e=>{e.preventDefault();let v=Object.fromEntries(new FormData(e.target));if(!v.name.trim())return;Object.assign(p,v,{name:v.name.trim(),badge:v.badge?[v.badge]:[]});save();render();toast('Character updated')}}
function renderSettings(){let p=state.profile;$('settings').innerHTML=`<div class="grid"><div class="card"><h2>Game Preferences</h2><form id="settingsForm" class="stack"><label class="field">Username<input name="name" required maxlength="40" value="${esc(p.name)}"></label><label class="field">Theme<select name="theme">${[['purple','Neon Purple'],['cyan','Electric Blue'],['rose','Neon Rose'],['green','Emerald']].map(([v,n])=>`<option value="${v}" ${p.theme===v?'selected':''}>${n}</option>`).join('')}</select></label><label><input type="checkbox" name="sound" ${p.sound?'checked':''}> Enable sound effects</label><label><input type="checkbox" name="reduced" ${p.reduced?'checked':''}> Reduce animations</label><button class="button">Save Settings</button></form><button class="button secondary" style="margin-top:10px" data-action="go" data-id="character">Customize Avatar & Profile</button></div><div class="card"><h2>Save Data</h2><p class="muted">Progress is stored locally in this browser. Export regularly to avoid losing it if browser data is cleared.</p><div class="actions"><button class="button" data-action="export">Export JSON</button><button class="button secondary" data-action="import">Import JSON</button></div><hr style="border-color:var(--line);margin:24px 0"><h2>Danger Zone</h2><p class="muted">Reset removes all local quests, XP, rewards and history.</p><button class="button danger" data-action="reset">Reset Game</button></div></div>`;$('settingsForm').onsubmit=e=>{e.preventDefault();let f=e.target;let theme=f.elements.theme.value;if(['rose','green'].includes(theme)&&stats().level<15){toast('Theme unlocks at level 15');return}p.name=f.elements.name.value.trim()||'Player One';p.theme=theme;p.sound=f.elements.sound.checked;p.reduced=f.elements.reduced.checked;save();render();toast('Settings saved')}}function exportData(){let blob=new Blob([JSON.stringify(state,null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='levelup-os-backup.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)}function importData(file){if(!file)return;if(file.size>5e6)return toast('Backup file too large');let reader=new FileReader();reader.onload=()=>{try{let s=JSON.parse(reader.result);if(!valid(s)||s.quests.length>10000||s.completions.length>100000||s.rewards.length>10000||s.purchases.length>100000)throw Error('Invalid backup');for(let q of s.quests)if(!q.id||!q.name||!DIFF[q.difficulty]||!SKILLS.includes(q.skill)||!['one-time','repeatable'].includes(q.type))throw Error('Invalid quest');for(let c of s.completions)if(!c.id||!c.questId||!DIFF[c.difficulty]||!SKILLS.includes(c.skill)||c.xp!==DIFF[c.difficulty]||c.coins!==money(c.difficulty))throw Error('Invalid completion');for(let p of s.purchases)if(!Number.isSafeInteger(p.price)||p.price<1)throw Error('Invalid purchase');if(!confirm('Replace ALL current game data with this backup?'))return;state=s;save();go('dashboard');toast('Backup imported')}catch(e){toast('Import failed: '+e.message)}};reader.readAsText(file)}function reset(){modal(`<h2>Reset All Progress?</h2><p>This permanently clears the current browser save. Export first if you want a backup.</p><div class="actions"><button class="button danger" id="confirmReset">Yes, Reset Everything</button><button class="button secondary" data-action="close">Cancel</button></div>`);$('confirmReset').onclick=()=>{state=fresh();save();closeModal();go('dashboard');toast('Game reset')}}
$('nav').innerHTML=pages.map(([id,label])=>`<button class="nav ${id==='dashboard'?'active':''}" data-page="${id}">${label}</button>`).join('');$('nav').onclick=e=>{let b=e.target.closest('[data-page]');if(b)go(b.dataset.page)};document.addEventListener('click',e=>{let b=e.target.closest('[data-action]');if(!b)return;let a=b.dataset.action,id=b.dataset.id;({go:()=>go(id),questForm:()=>questForm(id),complete:()=>complete(id),deleteQuest:()=>deleteQuest(id),rewardForm:()=>rewardForm(id),buy:()=>buy(id),deleteReward:()=>deleteReward(id),close:closeModal,export:exportData,import:()=>$('importFile').click(),reset})[a]?.()});$('importFile').onchange=e=>{importData(e.target.files[0]);e.target.value=''};$('modal').onclick=e=>{if(e.target===$('modal'))closeModal()};document.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal()});checkAchievements();save();render();
</script><script>if('serviceWorker' in navigator && (location.protocol==='https:'||location.hostname==='localhost')){addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(err=>console.warn('Offline cache unavailable:',err)));}</script></body></html>
